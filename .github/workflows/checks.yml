name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Linux test media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Linux source and media integration checks
        if: runner.os == 'Linux'
        run: npm test
        env:
          HUMANITY_TEST_MEDIA_DIR: /usr/bin
      - name: Windows source checks without binary payload
        if: runner.os == 'Windows'
        run: npm test
        env:
          HUMANITY_SKIP_MEDIA_TESTS: '1'
